# ============================================================
# RECEPTION / TICKET DESK DASHBOARD
# ============================================================
# ONE-TIME SETUP:
# 1. Settings → Dashboards → Add Dashboard
#    Title: Reception   |   URL path: reception
# 2. Open the new dashboard → ⋮ → Raw configuration editor
# 3. Delete everything and paste THIS entire file
# 4. Save
#
# Then open on the tablet:
#   http://YOUR-HA-IP:8123/lovelace/reception
#
# Find the exact entity IDs under:
#   Settings → Devices & Services → Queue Management → Main Queue
# ============================================================

title: Reception
views:
  - title: Take Ticket
    path: take
    icon: mdi:ticket-confirmation
    cards:
      - type: markdown
        content: |
          # 🎫 Welcome
          Please take a number and wait to be called.

      - type: button
        name: TAKE TICKET
        icon: mdi:ticket
        show_state: false
        show_icon: true
        tap_action:
          action: call-service
          service: queue_management.take_ticket
          data:
            queue_id: main
        hold_action:
          action: none

      - type: entities
        title: Your Ticket Number
        show_header_toggle: false
        entities:
          - entity: sensor.main_queue_last_ticket_issued
            name: Number
            icon: mdi:ticket-confirmation-outline

      - type: glance
        title: Queue Status
        columns: 2
        entities:
          - entity: sensor.main_queue_waiting
            name: People Waiting
            icon: mdi:account-group
          - entity: sensor.main_queue_current_serving
            name: Now Serving
            icon: mdi:account-voice

      - type: entities
        title: Staff Only
        entities:
          - entity: button.main_queue_reset_queue
            name: Reset Queue
