# ============================================================
# PUBLIC DISPLAY / WAITING AREA SCREEN
# ============================================================
# ONE-TIME SETUP:
# 1. Settings → Dashboards → Add Dashboard
#    Title: Waiting Area   |   URL path: display
# 2. Open → ⋮ → Raw configuration editor → paste this file
# 3. Save
#
# TV / tablet URL:
#   http://YOUR-HA-IP:8123/lovelace/display
# ============================================================

title: Waiting Area Display
views:
  - title: Now Serving
    path: now
    panel: true
    cards:
      - type: vertical-stack
        cards:
          - type: markdown
            content: |
              # NOW SERVING

          - type: entity
            entity: sensor.main_queue_current_serving
            name: " "
            icon: none

          - type: markdown
            content: |
              Please wait for your number to be called
