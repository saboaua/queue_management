# ============================================================
# CALLING DESK / COUNTER DASHBOARD
# ============================================================
# ONE-TIME SETUP:
# 1. Settings → Dashboards → Add Dashboard
#    Title: Calling   |   URL path: calling
# 2. Open → ⋮ → Raw configuration editor → paste this file
# 3. Save
#
# Tablet URL:
#   http://YOUR-HA-IP:8123/lovelace/calling
# ============================================================

title: Calling Desk
views:
  - title: Call Next
    path: call
    icon: mdi:bell-ring
    cards:
      - type: markdown
        content: |
          ## NOW SERVING

      - type: entity
        entity: sensor.main_queue_current_serving
        name: " "
        icon: mdi:account-voice

      - type: button
        name: CALL NEXT
        icon: mdi:bell-ring-outline
        show_state: false
        tap_action:
          action: call-service
          service: queue_management.call_next
          data:
            queue_id: main

      - type: glance
        title: Queue Overview
        columns: 3
        entities:
          - entity: sensor.main_queue_waiting
            name: Waiting
            icon: mdi:account-group
          - entity: sensor.main_queue_last_ticket_issued
            name: Last Issued
            icon: mdi:ticket
          - entity: sensor.main_queue_status
            name: Status
            icon: mdi:information-outline

      - type: markdown
        title: Waiting Tickets
        content: |
          {% set waiting = state_attr('sensor.main_queue_waiting', 'waiting_tickets') %}
          {% if waiting and waiting | length > 0 %}
          {% for t in waiting %}
          - **{{ t }}**
          {% endfor %}
          {% else %}
          _No one is waiting_
          {% endif %}
